name: Build and publish installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Flick
        run: zsh scripts/build-app.sh

      - name: Rename release asset
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            VERSION="local"
          fi
          mv "Flick-macOS-aarch64-${VERSION}.zip" "Flick-${VERSION}-aarch64-mac.zip"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: flick-macos-arm64
          path: Flick-*-aarch64-mac.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: flick-macos-arm64
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > release-notes-preamble.md <<'EOF'
          ## 安装说明（macOS Apple Silicon）

          1. 下载 `Flick-*-aarch64-mac.zip`
          2. 解压后得到 `Flick.app`
          3. 本版本**未做 Apple 代码签名**。若系统提示「无法验证开发者」：
             - 在 Finder 中右键应用 →「打开」→ 再次「打开」
             - 或到「系统设置 → 隐私与安全性」中允许打开
             - 若仍提示「已损坏」，可尝试（仅在确认来源可信时）：
               ```bash
               xattr -dr com.apple.quarantine ~/Downloads/Flick.app
               ```

          仅支持 Apple Silicon（arm64）macOS 14+。

          ---

          EOF
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Flick ${GITHUB_REF_NAME}" \
            --notes-file release-notes-preamble.md \
            --generate-notes \
            --repo "${GITHUB_REPOSITORY}"
